<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Mortality 1970-2010</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; text-align: center; }
  #chart { width: 800px; height: 500px; margin: 0 auto; }
  .tooltip {
    position: absolute; opacity: 0; background: white; border: 1px solid #ccc;
    padding: 8px; font-size: 13px; pointer-events: none; border-radius: 4px;
  }
  button { margin: 8px; padding: 8px 14px; font-size: 15px; cursor: pointer; }
  .bar { cursor: pointer; }
</style>
</head>
<body>

  <h1>Global Mortality, 1970 to 2010</h1>
  <p id="description">Loading data...</p>
  <div id="controls"></div>
  <svg id="chart"></svg>
  <div id="tooltip" class="tooltip"></div>

<script>
  // ---- parameters (state) ----
  let scene = "overview";
  let selectedCountry = null;
  let allData = [];

  const svg = d3.select("#chart");
  const description = d3.select("#description");
  const controls = d3.select("#controls");
  const tooltip = d3.select("#tooltip");

  const width = 800, height = 500;
  const margin = { top: 40, right: 30, bottom: 90, left: 70 };
  const innerWidth = width - margin.left - margin.right;
  const innerHeight = height - margin.top - margin.bottom;

  svg.attr("width", width).attr("height", height);
  const chartGroup = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // ---- load data, then show the first scene ----
  d3.json("data.json").then(data => {
    allData = data;
    drawOverview();
  }).catch(err => {
    console.error(err);
    description.text("Error loading data.json -- make sure it's next to index.html.");
  });

  // one reusable bar-chart drawing function, used by all three scenes.
  // items: array of {name, pct}. onClick: optional function(item).
  function drawBars(items, onClick) {
    chartGroup.selectAll("*").remove();

    const x = d3.scaleBand().domain(items.map(d => d.name)).range([0, innerWidth]).padding(0.3);
    const y = d3.scaleLinear()
      .domain([d3.min(items, d => d.pct) * 1.1, Math.max(0, d3.max(items, d => d.pct) * 1.1)])
      .range([innerHeight, 0]);

    // draw bars FIRST, axes AFTER -- otherwise a bar that starts right at the
    // 0% line paints over its own axis label underneath it
    const bars = chartGroup.selectAll(".bar")
      .data(items)
      .enter().append("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.name))
      .attr("width", x.bandwidth())
      .attr("y", y(0))
      .attr("height", 0)
      .attr("fill", d => d.pct < 0 ? "#2c7fb8" : "#de2d26")
      // triggers: hover shows a tooltip, click drills down (if provided)
      .on("mouseover", (event, d) => {
        tooltip.style("opacity", 1).html(`<strong>${d.name}</strong><br>${d.pct}%`);
      })
      .on("mousemove", event => {
        tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 20) + "px");
      })
      .on("mouseout", () => tooltip.style("opacity", 0))
      .style("cursor", onClick ? "pointer" : "default");

    if (onClick) bars.on("click", (event, d) => onClick(d));

    // transition: bars grow from 0 to their real height
    bars.transition().duration(600)
      .attr("y", d => d.pct < 0 ? y(0) : y(d.pct))
      .attr("height", d => Math.abs(y(d.pct) - y(0)));

    // value axis (left) is unaffected by this bug -- leave as-is
    chartGroup.append("g").call(d3.axisLeft(y).tickFormat(d => d + "%"));

    // thin zero-reference line drawn AT the data's zero value, wherever that falls
    chartGroup.append("line")
      .attr("x1", 0).attr("x2", innerWidth)
      .attr("y1", y(0)).attr("y2", y(0))
      .attr("stroke", "#333");

    // category labels are drawn at a FIXED position (bottom of the chart),
    // completely independent of where the zero line falls. Previously these
    // used the zero line's position, which broke when every bar in a scene
    // was negative (zero ends up at the TOP, cramming labels up there too).
    chartGroup.append("g")
      .attr("transform", `translate(0,${innerHeight + 5})`)
      .call(d3.axisBottom(x).tickSize(0))
      .select(".domain").remove();
    chartGroup.selectAll(".tick text")
      .attr("transform", "rotate(-40)")
      .style("text-anchor", "end")
      .attr("dx", "-0.3em");

    // annotation: a plain, fixed-position caption naming the most extreme
    // bar. Deliberately NOT tied to the bar's own position (that approach
    // kept colliding with neighboring bars or axis labels depending on the
    // data's sign/spread) -- a fixed spot is simple and never overlaps.
    const extreme = items.reduce((a, b) => Math.abs(a.pct) > Math.abs(b.pct) ? a : b);
    chartGroup.append("text")
      .attr("x", innerWidth - 10)
      .attr("y", -15)
      .attr("text-anchor", "end")
      .style("font-size", "13px")
      .style("fill", "#555")
      .text(`Biggest change: ${extreme.name} (${extreme.pct}%)`);
  }

  // ---- scene 1: overview -- one bar per country ----
  function drawOverview() {
    scene = "overview";
    description.text("Change in death rate by country, 1970 to 2010. Click a bar to see that country's age groups.");
    controls.html("");

    const items = allData.map(d => ({ name: d.country, pct: d.overallPct }));
    drawBars(items, d => {
      selectedCountry = allData.find(c => c.country === d.name);
      drawAgeGroups();
    });
  }

  // ---- scene 2: age-group breakdown for the selected country ----
  function drawAgeGroups() {
    scene = "ageGroups";
    description.text(`${selectedCountry.country}: change in death rate by age group.`);
    controls.html("");
    controls.append("button").text("<- Back to countries").on("click", drawOverview);
    controls.append("button").text("Compare by sex ->").on("click", drawSexCompare);

    drawBars(selectedCountry.ageGroups, null);
  }

  // ---- scene 3: male vs female change for the selected country ----
  function drawSexCompare() {
    scene = "sexCompare";
    description.text(`${selectedCountry.country}: change in death rate, male vs female.`);
    controls.html("");
    controls.append("button").text("<- Back to age groups").on("click", drawAgeGroups);

    drawBars(selectedCountry.sexCompare, null);
  }
</script>
</body>
</html>
