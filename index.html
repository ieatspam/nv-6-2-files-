<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Mortality 1970-2010 - Narrative Visualization</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  max-width: 960px;
  margin: 20px auto;
  color: #222;
}

h1 {
  margin-bottom: 0;
}

#subtitle {
  margin-top: 4px;
  color: #666;
  font-style: italic;
}

#nav {
  margin: 14px 0;
}

.nav-btn {
  font-family: inherit;
  padding: 6px 12px;
  margin-right: 6px;
  cursor: pointer;
}

.nav-btn.active {
  font-weight: bold;
  background: #ddd;
}

#caption {
  font-size: 1.05em;
  min-height: 1.4em;
}

svg#viz {
  width: 100%;
  height: 520px;
  border: 1px solid #ccc;
  display: block;
}

#controls {
  margin-top: 10px;
}

#controls select, #controls button {
  font-family: inherit;
  margin-right: 10px;
  padding: 4px 8px;
}

#hint {
  color: #777;
  font-size: 0.9em;
  font-style: italic;
}

/* tooltip div, per lecture slides 02-11 / 02-12 (D3 Events / Tooltips) */
.tooltip {
  position: absolute;
  opacity: 0;
  background: #333;
  color: #fff;
  padding: 4px 8px;
  font-size: 0.8em;
  border-radius: 3px;
  pointer-events: none;
}

.country-dot {
  stroke: #fff;
  stroke-width: 0.5px;
}

.country-dot:hover {
  stroke: #000;
  stroke-width: 1.5px;
  opacity: 1 !important;
}

.axis text { font-size: 0.75em; }

.bar-1970 { fill: #9ecae1; }
.bar-2010 { fill: #de2d26; }

.trend-line { fill: none; stroke: #2c7fb8; stroke-width: 2px; }
.trend-dot { fill: #2c7fb8; }

</style>
</head>
<body>

  <h1>Global Mortality, 1970-2010</h1>
  <p id="subtitle">A drill-down narrative visualization &mdash; CS416 final project</p>

  <div id="nav">
    <button class="nav-btn" data-scene="0">Scene 1: Overview</button>
    <button class="nav-btn" data-scene="1">Scene 2: Country Trend</button>
    <button class="nav-btn" data-scene="2">Scene 3: Age Breakdown</button>
  </div>

  <p id="caption"></p>

  <svg id="viz"></svg>

  <div id="controls"></div>

  <p id="hint"></p>
<script>
/* ============================================================
   Global Mortality 1970-2010 -- narrative visualization
   CS416 final project

   Structure: drill-down story
     Scene 0 = overview scatterplot (1970 death rate vs 2010 death rate,
               one dot per country -- dots below the diagonal improved)
     Scene 1 = trend line for one selected country
     Scene 2 = age-group breakdown for that country (1970 vs 2010)

   Data: IHME GBD 2010 age-specific mortality by country, 1970-2010

   Follows patterns from lecture slides:
     02-11 D3 Events        -> selection.on(event, listener)
     02-12 Tooltips          -> mouseover/mouseout div w/ pageX,pageY
                                (same idea as the life-expectancy-vs-GDP
                                scatterplot tooltip example)
     02-14 D3 Transitions    -> enter().append().attr(begin).transition().attr(end)

   NOTE: Scene 0 used to be a world map that fetched topojson shapes from
   a CDN. That extra network request was unreliable in some environments
   (blocked locally, blocked by some networks/extensions), so this version
   uses a scatterplot instead -- built entirely from the embedded data,
   no network request needed at all.
   ============================================================ */

// ---- parameters (state variables) ----
var state = {
  scene: 0,
  country: null
};

var YEARS = [1970, 1980, 1990, 2000, 2010];

var AGE_ORDER = ["0-6 days", "7-27 days", "28-364 days", "1-4 years", "5-9 years", "10-14 years",
  "15-19 years", "20-24 years", "25-29 years", "30-34 years", "35-39 years", "40-44 years",
  "45-49 years", "50-54 years", "55-59 years", "60-64 years", "65-69 years", "70-74 years",
  "75-79 years", "80+ years"];

var svg = d3.select("#viz");
var caption = d3.select("#caption");
var controls = d3.select("#controls");
var hint = d3.select("#hint");

// tooltip div, appended once -- see lecture slide "Event Coordinates"
var tooltip = d3.select("body").append("div").attr("class", "tooltip");

var overviewData, ageData, countryList;

d3.json("data.json").then(function (data) {
  overviewData = data.overview;
  ageData = data.ageBreakdown;
  countryList = data.countryList;
  setupNav();
  goToScene(0);
}).catch(function (err) {
  console.error("Error loading data.json:", err);
  caption.text("Error loading data.json -- make sure it's uploaded next to index.html and you're viewing this over http(s), not a local file.");
});

// ---- triggers: top nav buttons switch scenes ----
function setupNav() {
  d3.selectAll(".nav-btn").on("click", function () {
    var s = +d3.select(this).attr("data-scene");
    if (s > 0 && !state.country) state.country = "World (average)";
    goToScene(s);
  });
}

function setActiveNav() {
  d3.selectAll(".nav-btn").classed("active", false);
  d3.select('.nav-btn[data-scene="' + state.scene + '"]').classed("active", true);
}

// full scene change: clear the SVG and controls, build from scratch
function goToScene(s) {
  state.scene = s;
  setActiveNav();
  svg.html("");
  controls.html("");
  if (s === 0) buildOverviewScene();
  else if (s === 1) buildTrendScene();
  else buildAgeScene();
}

/* ============================================================
   SCENE 0 -- overview scatterplot
   x = 1970 death rate, y = 2010 death rate, one dot per country.
   Dots below the diagonal line improved; above it got worse.
   ============================================================ */
function buildOverviewScene() {
  hint.text("Click a country's dot to drill into its story.");
  caption.html("Each dot is one country: 1970 death rate on the x-axis, 2010 on the y-axis. " +
    "Dots <strong>below</strong> the diagonal line improved; dots <strong>above</strong> it got worse.");

  // build (v1970, v2010) pairs per country from the embedded overview data
  var byCountry = d3.group(overviewData.filter(function (d) { return d.country !== "World (average)"; }), function (d) { return d.country; });
  var points = [];
  byCountry.forEach(function (rows, name) {
    var r1970 = rows.find(function (d) { return d.year === 1970; });
    var r2010 = rows.find(function (d) { return d.year === 2010; });
    if (r1970 && r2010) points.push({ country: name, v1970: r1970.deathRate, v2010: r2010.deathRate });
  });

  var width = 900, height = 520, m = { top: 30, right: 30, bottom: 50, left: 70 };
  svg.attr("viewBox", "0 0 " + width + " " + height);

  var maxVal = d3.max(points, function (d) { return Math.max(d.v1970, d.v2010); }) * 1.05;
  var x = d3.scaleLinear().domain([0, maxVal]).range([m.left, width - m.right]);
  var y = d3.scaleLinear().domain([0, maxVal]).range([height - m.bottom, m.top]);

  svg.append("g").attr("class", "axis")
    .attr("transform", "translate(0," + (height - m.bottom) + ")")
    .call(d3.axisBottom(x));
  svg.append("g").attr("class", "axis")
    .attr("transform", "translate(" + m.left + ",0)")
    .call(d3.axisLeft(y));

  svg.append("text").attr("x", width / 2).attr("y", height - 8)
    .attr("text-anchor", "middle").attr("font-size", "0.85rem").attr("fill", "#666")
    .text("Death rate per 100,000 in 1970");
  svg.append("text").attr("x", -height / 2).attr("y", 18)
    .attr("transform", "rotate(-90)").attr("text-anchor", "middle")
    .attr("font-size", "0.85rem").attr("fill", "#666")
    .text("Death rate per 100,000 in 2010");

  // diagonal reference line (y = x)
  svg.append("line")
    .attr("x1", x(0)).attr("y1", y(0))
    .attr("x2", x(maxVal)).attr("y2", y(maxVal))
    .attr("stroke", "#999").attr("stroke-dasharray", "4,4");

  // dots: enter at radius 0 (beginning setting), transition to radius 5 (ending setting)
  // -- exact pattern from the "Transitions Pattern" slide
  var dots = svg.selectAll(".country-dot")
    .data(points)
    .enter().append("circle")
    .attr("class", "country-dot")
    .attr("cx", function (d) { return x(d.v1970); })
    .attr("cy", function (d) { return y(d.v2010); })
    .attr("r", 0)
    .attr("fill", function (d) { return d.v2010 < d.v1970 ? "#2c7fb8" : "#de2d26"; })
    .attr("opacity", 0.65)
    .style("cursor", "pointer");

  dots.transition().duration(700).attr("r", 5);

  // event listeners, per D3 Events slide: selection.on(event, listener)
  dots.on("mouseover", function (event, d) {
    var pct = Math.round((d.v2010 - d.v1970) / d.v1970 * 100);
    tooltip.style("opacity", 1)
      .style("left", (event.pageX + 10) + "px")
      .style("top", (event.pageY - 20) + "px")
      .html("<strong>" + d.country + "</strong><br>1970: " + Math.round(d.v1970) +
        "<br>2010: " + Math.round(d.v2010) + "<br>" + (pct < 0 ? "" : "+") + pct + "%");
  });
  dots.on("mouseout", function () { tooltip.style("opacity", 0); });
  dots.on("click", function (event, d) {
    state.country = d.country;
    goToScene(1); // scene change -- drill down
  });

  // baked-in annotation with the headline stat
  var improved = points.filter(function (d) { return d.v2010 < d.v1970; }).length;
  var pctImproved = Math.round(improved / points.length * 100);

  try {
    svg.append("g").attr("class", "annotation").call(
      d3.annotation().type(d3.annotationLabel).annotations([{
        note: { title: pctImproved + "% of countries improved", label: "fell below the diagonal line" },
        x: x(maxVal * 0.25), y: y(maxVal * 0.55), dx: 10, dy: -10
      }])
    );
  } catch (err) {
    console.warn("annotation library unavailable, skipping annotation:", err);
  }
}

/* ============================================================
   SCENE 1 -- selected country's trend line, 1970-2010
   ============================================================ */
function buildTrendScene() {
  hint.text("Switch countries below, jump to the age breakdown, or go back to the overview.");
  buildControlBar();
  drawTrend(state.country);

  controls.append("button")
    .text("See age breakdown ->")
    .on("click", function () { goToScene(2); });
}

function drawTrend(countryName) {
  var rows = overviewData.filter(function (d) { return d.country === countryName; })
    .sort(function (a, b) { return a.year - b.year; });
  var r1970 = rows.find(function (d) { return d.year === 1970; }).deathRate;
  var r2010 = rows.find(function (d) { return d.year === 2010; }).deathRate;
  var pct = Math.round((r2010 - r1970) / r1970 * 100);
  var dir = pct < 0 ? "fell" : "rose";

  caption.html(countryName + "'s death rate " + dir + " " + Math.abs(pct) +
    "% between 1970 and 2010 (" + Math.round(r1970) + " -> " + Math.round(r2010) + " per 100,000).");

  svg.html("");
  var width = 900, height = 460, m = { top: 30, right: 30, bottom: 40, left: 70 };
  svg.attr("viewBox", "0 0 " + width + " " + height);

  var x = d3.scaleLinear().domain(d3.extent(YEARS)).range([m.left, width - m.right]);
  var y = d3.scaleLinear().domain([0, d3.max(rows, function (d) { return d.deathRate; }) * 1.15]).nice()
    .range([height - m.bottom, m.top]);

  svg.append("g").attr("class", "axis")
    .attr("transform", "translate(0," + (height - m.bottom) + ")")
    .call(d3.axisBottom(x).tickFormat(d3.format("d")).ticks(5));
  svg.append("g").attr("class", "axis")
    .attr("transform", "translate(" + m.left + ",0)")
    .call(d3.axisLeft(y));

  var line = d3.line().x(function (d) { return x(d.year); }).y(function (d) { return y(d.deathRate); });

  svg.append("path")
    .datum(rows)
    .attr("class", "trend-line")
    .attr("d", line)
    .style("opacity", 0)
    .transition().duration(700)
    .style("opacity", 1);

  var dots = svg.selectAll(".trend-dot")
    .data(rows)
    .enter().append("circle")
    .attr("class", "trend-dot")
    .attr("cx", function (d) { return x(d.year); })
    .attr("cy", function (d) { return y(d.deathRate); })
    .attr("r", 0);

  dots.transition().duration(700).attr("r", 5);

  dots.on("mouseover", function (event, d) {
    tooltip.style("opacity", 1)
      .style("left", (event.pageX + 10) + "px")
      .style("top", (event.pageY - 20) + "px")
      .html(d.year + "<br>" + Math.round(d.deathRate) + " / 100,000");
  });
  dots.on("mouseout", function () { tooltip.style("opacity", 0); });

  var last = rows[rows.length - 1];
  try {
    svg.append("g").attr("class", "annotation").call(
      d3.annotation().type(d3.annotationCalloutCircle).annotations([{
        note: { title: pct + "% change", label: "1970 to 2010" },
        x: x(last.year), y: y(last.deathRate), dx: -110, dy: -60
      }])
    );
  } catch (err) {
    console.warn("annotation library unavailable, skipping annotation:", err);
  }
}

/* ============================================================
   SCENE 2 -- age-group breakdown, 1970 vs 2010
   ============================================================ */
function buildAgeScene() {
  hint.text("Switch countries below, or go back to the overview.");
  buildControlBar();
  drawAgeChart(state.country);

  controls.append("button")
    .text("<- Back to trend")
    .on("click", function () { goToScene(1); });
}

function mergedAgeData(countryName) {
  var rows = ageData.filter(function (d) { return d.country === countryName; });
  var byAge = d3.group(rows, function (d) { return d.ageGroup; });
  return AGE_ORDER.map(function (ag) {
    var g = byAge.get(ag) || [];
    var r1970 = g.find(function (d) { return d.year === 1970; });
    var r2010 = g.find(function (d) { return d.year === 2010; });
    return { ageGroup: ag, v1970: r1970 ? r1970.deathRate : 0, v2010: r2010 ? r2010.deathRate : 0 };
  });
}

function drawAgeChart(countryName) {
  var merged = mergedAgeData(countryName);

  var biggest = null, biggestPct = 0;
  merged.forEach(function (d) {
    if (d.v1970 > 0) {
      var pct = (d.v2010 - d.v1970) / d.v1970 * 100;
      if (pct < biggestPct) { biggestPct = pct; biggest = d; }
    }
  });

  caption.html("In " + countryName + ", the steepest drop was in " +
    (biggest ? biggest.ageGroup : "early childhood") + " (" + Math.round(biggestPct) +
    "%). Older ages moved far less -- this was mostly a children's health story.");

  svg.html("");
  var width = 900, height = 480, m = { top: 30, right: 30, bottom: 110, left: 70 };
  svg.attr("viewBox", "0 0 " + width + " " + height);

  var x0 = d3.scaleBand().domain(AGE_ORDER).range([m.left, width - m.right]).padding(0.25);
  var x1 = d3.scaleBand().domain(["1970", "2010"]).range([0, x0.bandwidth()]).padding(0.08);
  var y = d3.scaleLinear().domain([0, d3.max(merged, function (d) { return Math.max(d.v1970, d.v2010); }) * 1.1]).nice()
    .range([height - m.bottom, m.top]);

  svg.append("g").attr("class", "axis")
    .attr("transform", "translate(0," + (height - m.bottom) + ")")
    .call(d3.axisBottom(x0))
    .selectAll("text").attr("transform", "rotate(-45)").style("text-anchor", "end");
  svg.append("g").attr("class", "axis")
    .attr("transform", "translate(" + m.left + ",0)")
    .call(d3.axisLeft(y));

  var groups = svg.selectAll(".age-group")
    .data(merged)
    .enter().append("g")
    .attr("class", "age-group")
    .attr("transform", function (d) { return "translate(" + x0(d.ageGroup) + ",0)"; });

  groups.append("rect")
    .attr("class", "bar-1970")
    .attr("x", x1("1970")).attr("width", x1.bandwidth())
    .attr("y", y(0)).attr("height", 0)
    .on("mouseover", function (event, d) { barTip(event, d, 1970, d.v1970); })
    .on("mouseout", function () { tooltip.style("opacity", 0); })
    .transition().duration(700)
    .attr("y", function (d) { return y(d.v1970); })
    .attr("height", function (d) { return y(0) - y(d.v1970); });

  groups.append("rect")
    .attr("class", "bar-2010")
    .attr("x", x1("2010")).attr("width", x1.bandwidth())
    .attr("y", y(0)).attr("height", 0)
    .on("mouseover", function (event, d) { barTip(event, d, 2010, d.v2010); })
    .on("mouseout", function () { tooltip.style("opacity", 0); })
    .transition().duration(700).delay(150)
    .attr("y", function (d) { return y(d.v2010); })
    .attr("height", function (d) { return y(0) - y(d.v2010); });

  var legend = svg.append("g").attr("transform", "translate(" + (width - 160) + "," + m.top + ")");
  legend.append("rect").attr("class", "bar-1970").attr("width", 14).attr("height", 14);
  legend.append("text").attr("x", 20).attr("y", 12).text("1970");
  legend.append("rect").attr("class", "bar-2010").attr("x", 70).attr("width", 14).attr("height", 14);
  legend.append("text").attr("x", 90).attr("y", 12).text("2010");

  if (biggest) {
    try {
      svg.append("g").attr("class", "annotation").call(
        d3.annotation().type(d3.annotationCalloutElbow).annotations([{
          note: { title: "Biggest decline", label: biggest.ageGroup + ": " + Math.round(biggestPct) + "%" },
          x: x0(biggest.ageGroup) + x0.bandwidth() / 2, y: y(biggest.v1970), dx: 40, dy: -90
        }])
      );
    } catch (err) {
      console.warn("annotation library unavailable, skipping annotation:", err);
    }
  }
}

function barTip(event, d, year, val) {
  tooltip.style("opacity", 1)
    .style("left", (event.pageX + 10) + "px")
    .style("top", (event.pageY - 20) + "px")
    .html(d.ageGroup + ", " + year + "<br>" + Math.round(val) + " / 100,000");
}

/* ============================================================
   shared controls for scenes 1 and 2: back button + country select
   ============================================================ */
function buildControlBar() {
  controls.append("button")
    .text("<- Back to overview")
    .on("click", function () { goToScene(0); });

  controls.append("span").text(" Country: ");
  var select = controls.append("select");
  select.selectAll("option")
    .data(countryList)
    .enter().append("option")
    .attr("value", function (d) { return d; })
    .property("selected", function (d) { return d === state.country; })
    .text(function (d) { return d; });

  select.on("change", function () {
    state.country = this.value;
    if (state.scene === 1) drawTrend(state.country);
    else drawAgeChart(state.country);
  });
}

  </script>
</body>
</html>
